# Public 443: real sites by SNI → nginx :4443, Telegram FakeTLS (cloudflare) → mtg :4433
map $ssl_preread_server_name $mtg_backend {
    www.cloudflare.com  mtproto;
    cloudflare.com      mtproto;
    default             https_sites;
}

upstream mtproto {
    server 127.0.0.1:4433;
}

upstream https_sites {
    server 127.0.0.1:4443;
}

server {
    listen 443;
    listen [::]:443 ipv6only=on;
    ssl_preread on;
    proxy_pass $mtg_backend;
    proxy_timeout 1d;
    proxy_connect_timeout 10s;
}
