# Public 443: Telegram FakeTLS uses www.medialive.tech (A-record = this VPS).
# Other site names go to nginx :4443. Failed MTProto probes are forwarded
# by mtg to 127.0.0.1:4443 so the website still answers.
map $ssl_preread_server_name $mtg_backend {
    www.medialive.tech  mtproto;
    default             https_sites;
}

upstream mtproto {
    server 127.0.0.1:4433;
}

upstream https_sites {
    server 127.0.0.1:4443;
}

server {
    listen 443;
    listen [::]:443 ipv6only=on;
    ssl_preread on;
    proxy_pass $mtg_backend;
    proxy_timeout 1d;
    proxy_connect_timeout 10s;
}
